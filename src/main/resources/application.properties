server.port=8000

# Derby embedded datasource
spring.datasource.url=jdbc:derby:foodhub_db;create=true
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver
spring.datasource.username=
spring.datasource.password=

# Auto-create tables from schema.sql
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Hibernate dialect for Derby
spring.jpa.database-platform=org.hibernate.dialect.DerbyDialect
spring.jpa.hibernate.ddl-auto=update

# Ensure data.sql runs AFTER Hibernate creates the tables
spring.jpa.defer-datasource-initialization=true